spring.application.name=url-shortener
server.port=8080

# MySQL (override with environment variables if your setup is different)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/urlshortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Spring Data JPA: creates and updates the table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# App settings
app.base-url=http://localhost:8080
app.cache-ttl-minutes=60
app.code-length=7
